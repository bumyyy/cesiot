<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - Smart Door</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
      body {
        background-color: #f0f2f5;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-card {
        width: 100%;
        max-width: 400px;
        border: none;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      }
      .card-header {
        background: transparent;
        border-bottom: none;
        padding-top: 2rem;
        text-align: center;
      }
      .btn-primary {
        background-color: #0d6efd;
        padding: 10px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>

    <div class="card login-card p-3">
      <div class="card-header">
        <div class="mb-3">
          <img src="/logo.png" alt="Logo" style="height: 50px; width: auto;">
        </div>
        <h4 class="fw-bold text-dark">CESIOT</h4>
        <p class="text-muted small">Connectez-vous pour accéder au monitoring</p>
      </div>
      
      <div class="card-body">
        <div id="errorAlert" class="alert alert-danger d-none" role="alert">
            Identifiants incorrects !
        </div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label text-secondary small">Nom d'utilisateur</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control bg-light border-start-0" id="username" placeholder="ex: user1" required>
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label text-secondary small">Mot de passe</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control bg-light border-start-0" id="password" placeholder="••••••••" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 rounded-pill mb-3">
            Se connecter <i class="bi bi-arrow-right ms-2"></i>
          </button>
        </form>
      </div>
    </div>
  </body>

  <script src="/login/login.js"></script>

</html>
