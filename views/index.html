<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CESIOT Door Monitor - Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .card-header {
            background-color: white;
            border-bottom: 1px solid #f0f0f0;
            font-weight: 600;
            border-radius: 12px 12px 0 0 !important;
            padding-top: 15px;
            padding-bottom: 15px;
        }
        .icon-box {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
        /* Animation pour l'alerte */
        .pulse-danger {
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
        @keyframes fadeIn {
        from { opacity: 0; background-color: #e2e6ea; }
        to { opacity: 1; background-color: transparent; }
        }
    </style>
  </head>
  <body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm mb-4">
      <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
            <img src="/logo.png" alt="Logo" style="height: 40px; width: auto;">
            <span class="fw-bold">CESIOT Door Monitor</span>
            <div class="d-flex gap-2">
                <a href="/admin" id="btnAdmin" class="btn btn-outline-dark btn-sm" style="display: none;">Panel Admin</a>
                <button onclick="logout()" class="btn btn-danger btn-sm">Déconnexion</button>
            </div>
        </a>
      </div>
    </nav>

      <div class="container-fluid py-4" style="max-width: 1100px;">        
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-activity me-2 text-primary"></i>État des portes en temps réel</span>
                        <span class="badge bg-light text-dark border">Live</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th scope="col" class="ps-4">Localisation</th>
                                        <th scope="col">Porte N°</th>
                                        <th scope="col">État</th>
                                        <th scope="col">Température</th>
                                        <th scope="col">Dernière activité</th>
                                    </tr>
                                </thead>
                                <tbody id="liveStatusTable"></tbody> 
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm flex-fill">
          <div class="card border-0 shadow-sm w-100">
              <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                  <h6 class="m-0 font-weight-bold text-primary">
                      <i class="bi bi-calendar-check me-2"></i>Statistiques Annuelles
                  </h6>
                  <select id="yearSelect" class="form-select form-select-sm border-light bg-light" style="width: auto;"></select>
              </div>
              <div class="card-body">
                  <div style="position: relative; height: 100%; min-height: 300px;">
                      <canvas id="chartMonth"></canvas>
                  </div>
              </div>
          </div>
        </div>

        

          <div class="card border-0 shadow-sm flex-fill">
              <div class="card-header bg-white py-3">
                  <h6 class="m-0 font-weight-bold text-primary">
                      <i class="bi bi-clock-history me-2"></i>Activité par Heure
                  </h6>
              </div>
              <div class="card-body">
                  <div style="position: relative; height: 100%; min-height: 300px;">
                      <canvas id="chartHour"></canvas>
                  </div>
              </div>
          </div>

          <div class="card border-0 shadow-sm flex-fill">
              <div class="card-header bg-white py-3">
                  <h6 class="m-0 font-weight-bold text-primary">
                      <i class="bi bi-trophy me-2"></i>Portes les plus actives
                  </h6>
              </div>
              <ul class="list-group list-group-flush" id="topDoorList">
              </ul>
          </div>

    
</div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <script src="./auth.js"></script>
    <script>
         if(localStorage.getItem('user')) {
            const user = JSON.parse(localStorage.getItem('user'));
            if(user.role == 'admin') {
                const btn = document.getElementById('btnAdmin');
            if (btn) {
                btn.style.display = 'inline-block';
            }
            }
        }
        
    </script>
    <script src="./dashboard/realtime.js"></script>
    <script src="./dashboard/selectyear.js"></script>
    <script src="./dashboard/stateMonth.js"></script>
    <script src="./dashboard/stateHour.js"></script>
    <script src="./dashboard/stateDoor.js"></script>
    <script src="./dashboard/topDoors.js"></script>

  </body>
</html>
